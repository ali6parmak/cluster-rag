# Phase 2: full-dataset embedding with Ollama snowflake-arctic-embed2 /api/embed.
#
# Model card (Snowflake arctic-embed v2.0): only queries take the "query: "
# prefix; documents are embedded without one. 8192-token context: no UPR or
# auxiliary text needs truncation.
extends: ../base.yaml

run_id: embed-arctic2

embed:
  backend: ollama
  model_id: snowflake-arctic-embed2:latest
  batch_size: 64
  prefixes:
    query: "query: "
    document: ""
    label: "query: "

preprocess:
  variant: raw