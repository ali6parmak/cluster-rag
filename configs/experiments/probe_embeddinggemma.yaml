# Phase 2 omct probe: Ollama embeddinggemma (v1, 300M, 2048 ctx, 768d).
# Model card prompts are templates: query  "task: search result | query: {content}",
# document "title: none | text: {content}". (Ollama's artifact is the QAT Q4_0
# build -- recorded in the run digest; the quantization costs some quality.)
extends: ../base.yaml

run_id: probe-embeddinggemma

embed:
  backend: ollama
  model_id: embeddinggemma:latest
  batch_size: 64
  prefixes:
    query: "task: search result | query: {content}"
    document: "title: none | text: {content}"
    label: "task: classification | query: {content}"

probe:
  # strip_block is the default question transform (Phase 2.5); the Phase 2
  # keep-vs-strip comparison is recorded in docs/experiments.md. Use
  # question_transforms: [strip_block, keep] for an explicit re-comparison.
  question_block_markers: ["Answer choices:", "Notes:"]
  recall_ks: [1, 10]