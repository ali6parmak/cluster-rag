# Standalone example of the Phase 3 exit criterion (one command evaluates any
# predictor on val or test):
#
#     uv run cluster-rag evaluate --config configs/experiments/eval_baseline_most_frequent.yaml --split val
#
# Same run_id as the sweep cell upr-eval-mf-topk2-val in
# experiments/baseline_eval_sweep.py (the table upserts by run_id; the sweep
# file remains the grid source of truth). Only the predictor is per-run by
# design: decision (top_k k=2), metric grids and split come from the base
# schema defaults (commented block in configs/base.yaml).
extends: ../base.yaml

run_id: upr-eval-mf-topk2-val

eval:
  predictor:
    name: most_frequent