# Phase 2 aux probe: Ollama mxbai-embed-large (334M, 512 ctx, 1024d).
# Ollama model card: the query/passage prompt
# "Represent this sentence for searching relevant passages: " goes on the query
# side (asymmetric model); documents stay unprefixed. 512-token context truncates.
extends: ../base.yaml

run_id: probe-mxbai

embed:
  backend: ollama
  model_id: mxbai-embed-large:latest
  batch_size: 64
  prefixes:
    query: "Represent this sentence for searching relevant passages: "
    document: ""
    label: ""

probe:
  # strip_block is the default question transform (Phase 2.5); the Phase 2
  # keep-vs-strip comparison is recorded in docs/experiments.md. Use
  # question_transforms: [strip_block, keep] for an explicit re-comparison.
  question_block_markers: ["Answer choices:", "Notes:"]
  recall_ks: [1, 10]