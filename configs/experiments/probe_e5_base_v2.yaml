# Phase 2 aux probe: intfloat/e5-base-v2 (sentence-transformers).
# Model card: "query: " on the query side, "passage: " on the indexed side.
# Paragraphs = indexed (document kind), questions = queries. 512-token context.
extends: ../base.yaml

run_id: probe-e5-base-v2

embed:
  backend: hf
  model_id: intfloat/e5-base-v2
  revision: f52bf8ec8c7124536f0efb74aca902b2995e5bcd
  batch_size: 64
  device: null
  prefixes:
    query: "query: "
    document: "passage: "
    label: "query: "

probe:
  # strip_block is the default question transform (Phase 2.5); the Phase 2
  # keep-vs-strip comparison is recorded in docs/experiments.md. Use
  # question_transforms: [strip_block, keep] for an explicit re-comparison.
  question_block_markers: ["Answer choices:", "Notes:"]
  recall_ks: [1, 10]