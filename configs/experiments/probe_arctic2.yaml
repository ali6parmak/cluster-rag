# Phase 2 aux probe: Ollama snowflake-arctic-embed2 (v2.0, 566M, 8192 ctx).
# Model card: queries take the "query: " prefix; documents none (CLS token).
extends: ../base.yaml

run_id: probe-arctic2

embed:
  backend: ollama
  model_id: snowflake-arctic-embed2:latest
  batch_size: 64
  prefixes:
    query: "query: "
    document: ""
    label: "query: "

probe:
  # strip_block is the default question transform (Phase 2.5); the Phase 2
  # keep-vs-strip comparison is recorded in docs/experiments.md. Use
  # question_transforms: [strip_block, keep] for an explicit re-comparison.
  question_block_markers: ["Answer choices:", "Notes:"]
  recall_ks: [1, 10]