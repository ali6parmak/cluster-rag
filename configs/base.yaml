# Base configuration for cluster-rag.
#
# All values live here, never in the code (AGENTS.md coding conventions).
# Paths are resolved relative to the current working directory:
# run the CLI from the repository root.
# Experiment-specific overrides go in configs/experiments/*.yaml.

run_id: base      # results are written to results/<run_id>/ from Phase 3 on
seed: 42          # fix all random seeds (numpy/random/torch/UMAP) for reproducibility

# Kinds the `embed` command encodes for, one matrix per kind (encode kinds
# document/query/label from src/cluster_rag/embed/base.py). Sweep cells carry
# their own kinds (EmbedCell.kinds); standalone `--kinds` overrides this.
embed_kinds: [document]

paths:
  data_raw: data/raw/upr.jsonl    # original JSONL dataset, read-only
  data_processed: data/processed
  data_splits: data/splits        # fixed split id lists (committed, they are small)
  label_catalog: catalogs/upr_labels.jsonl  # optional labels.jsonl with name/description/parent
                                           # (the text-processing track's CS-11 catalog;
                                           # label-side knowledge, not dataset data)
  data_external: data/external/omct_pairs.json  # auxiliary pairwise dataset (PLAN.md section 2)
  cache: cache                    # embedding cache (gitignored)
  results: results                # run artifacts (gitignored)
  # Per-dataset comparison tables, auto-appended by the CLI commands (Phase 3.5):
  # a command's dataset picks the file, the run's sweep label picks the section.
  experiment_table_upr: docs/experiments_table_upr.md
  experiment_table_omct: docs/experiments_table_omct.md
  # The text-processing track's own pair of tables (TEXT_PROCESSING_PLAN.md):
  # the track's command family writes to them, never to the files above.
  # The UPR one turns on with the track's UPR stage (Stage 5, CS-8a).
  experiment_table_text_processing_omct: docs/experiments_table_text_processing_omct.md
  experiment_table_text_processing_upr: docs/experiments_table_text_processing_upr.md

stats:
  # Label frequency buckets: head >= head_min, torso >= torso_min, tail below.
  # Defaults chosen for this dataset (68 labels): head 16, torso 34, tail 18.
  frequency_head_min: 100
  frequency_torso_min: 40
  prefix_max_words: 3
  prefix_lowercase: true
  top_n_labels: 15
  top_n_pairs: 10
  top_n_prefixes: 10

splits:
  ratios: [0.7, 0.15, 0.15]  # train / val / test, multi-label iterative stratification
  coverage_min_total: 3      # labels rarer than this are not force-corrected between splits
  label_holdout:
    n_labels: 8              # labels removed entirely from train (zero-shot discovery test)
    min_examples: 30         # eligibility: total examples within [min_examples, max_examples]
    max_examples: 80

# Phase 2 sections. `embed` (backend/model/prefixes) is defined per experiment in
# configs/experiments/*.yaml -- model ids and prefixes must never be hard-coded
# in code (AGENTS.md). Schema defaults (see src/cluster_rag/config.py):
#   embed:     {backend, model_id, prefixes: {query, document, label},
#               dimension, batch_size: 64, device, revision, trust_remote_code,
#               host, timeout: 120}          # hf-specific: device/revision/trust_remote_code;
#                                            # ollama-specific: host/timeout/dimension
#   preprocess: {variant: raw, strip_openers: [...]}  # variants: raw | lowercase |
#                                            # strip_leading_formulaic; openers below
#   cache:     {enabled: true}               # disk cache at paths.cache
#   probe:     {question_transforms: [strip_block],     # default; add "keep" for an
#               question_block_markers: ["Answer choices:", "Notes:"],
#               recall_ks: [1, 10]}          # explicit comparison; used by `probe-omct`
#
# Phase 3 eval defaults (schema defaults, commented — the predictor name is
# per-run by design; sweep cells set it). `evaluate` requires eval.predictor:
#   eval:      {predictor: {name: <per-run>, params: {}},
#               embedding_run_id: null,             # Phase 4: for embedding predictors set
#               label_embedding_run_id: null,       # a prior upr-embed-<model> run_id, e.g.
#               decision: {rule: top_k, k: 2},      # upr-embed-e5-base-v2 (knn/prototype/
#                                                   # fusion); zeroshot + fusion(c>0) also
#               metrics:  {ks: [1, 3, 5, 10],       # need the zero-shot label run:
#                          shortlist_ms: [20, 50, 100]},  # upr-labelembed-<model>[-<variant>]
#               split: val}                          # val | test (final numbers only)
#
# Zero-shot label artifacts (Phase 4): `cluster-rag labelembed` embeds one text
# per dataset label (sorted unique; no catalog file); per-label texts are
# config-driven:
#   label_texts: {variant: name,        # name | template; template must carry
#                 template: null}       # "{label}", e.g. "This recommendation
#                                       # is about {label}."
#
# Text-processing track (TEXT_PROCESSING_PLAN.md): `cluster-rag analyze-omct`
# writes the Stage-0 pair-score artifact — the OMCT benchmark (per-pair
# scores, the unjudged control set, the per-document strata, the negative
# enrichment). The models and the control design are per experiment, so they
# live in the track's Python sweeps (experiments_text_processing/); the schema
# defaults are:
#   analysis: {embedders: [{name: <model handle>,   # e.g. "embeddinggemma"
#                           embed: {backend, model_id, prefixes: {...}}}],
#               control_size: 4000,        # unjudged control cells (subset B)
#               sampling_rule: proportional,
#               question_transform: strip_block,   # keep | strip_block
#               question_block_markers: ["Answer choices:", "Notes:"],
#               chunker: {name: full_text, params: {}},  # the track's chunker
#               # registry + its parameters (a bare name is also accepted)
#               aggregations: [],          # the structural arms' rules:
#                                         # max | mean | "top_k_mean:k"
#               question_transforms: [],   # extra question-side arms
#                                         # (the free keep vs strip_block)
#               bootstrap: {resamples: 2000, seed: null}}  # the paired
#                                         # bootstrap of the AUC difference
#                                         # (seed: null = the run's seed)
#
# The decision models (the track's Stage 3.5, `cluster-rag decide-omct`): the
# prompt grid is config, not code, and every model is pinned by id AND digest
# (the run fails on a digest mismatch). The schema defaults are:
#   analysis.decision: {models: [{name: <arm handle>,
#                                 model_id: <ollama tag>,
#                                 digest: <the pinned sha256>,
#                                 state: pair,        # pair | paragraph
#                                 question_type: noul,  # noul | choice
#                                 instructions: <the TASK instruction, no
#                                            {question} placeholder>,
#                                 options: [], criteria: {},
#                                 positive_option: null,   # the choice type only
#                                 max_input_tokens: null}],  # the model's context
#                              scope: judged,       # judged | grid
#                              competence_control: true,
#                              competence_pairs: 100,
#                              prompt_version: v1,  # part of the decision cache's key
#                              host: http://localhost:11434,
#                              timeout: 600, max_questions_per_call: 64,
#                              bins: 10}            # the reliability diagram's bins
#
# strip_openers defaults come from the Phase 1 prefix analysis (17.8% of texts
# start with "continue"); longest opener wins, so multi-word forms are listed
# before their shorter prefixes.
preprocess:
  variant: raw
  strip_openers:
    - continue to
    - continue its efforts to
    - continue its efforts
    - continue its
    - continue efforts to
    - continue efforts
    - continue
    - ensure that the
    - ensure that
    - ensure the
    - ensure
    - take all necessary measures to
    - take all necessary measures
    - take measures to
    - take measures
    - take steps to
    - take steps
    - take
    - strengthen
    - adopt
    - consider
    - ratify
    - establish
    - implement
    - further
    - increase
    - review
    - develop
    - intensify